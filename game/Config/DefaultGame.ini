[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=UnrealCitizen
ProjectVersion=0.0.1
Description=UnrealCitizen

[/Script/UnrealEd.ProjectPackagingSettings]
; WP-A1: a prepared level's audio (the prep step, -run=SCPrepare: SCPrepareAudio.h): the package's audio.json, Ogg media and
; impulse responses as loose files, read and decoded at run time like a package's.
+DirectoriesToAlwaysStageAsNonUFS=(Path="SCAudio")
; WP-O1-4: the prepared scenarios' records (Content/SCPrepared/<name>.json, FUCPrepared): a run reads its scenario from them.
+DirectoriesToAlwaysStageAsUFS=(Path="SCPrepared")
; Loaded by path at run time, so no cooked map references them: the plugin's masters and post-process materials
; (importer, SCViewerExposure's display curve, the shot effects), the cargo art (drone stand-in, dock, beam mesh;
; SCCargoDrone.cpp loads it by path) and the engine shapes of the shot effects (SCPlayerFire).
+DirectoriesToAlwaysCook=(Path="/SCBridge/Materials")
+DirectoriesToAlwaysCook=(Path="/SCBridge/Cargo")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
