; Project scalability overrides (engine defaults: Engine/Config/BaseScalability.ini). The Viewer runs at Epic (@3).

[ShadowQuality@3]
; WP-U59 (ue/verification/WP-U59.md, MegaLights quality): shade and trace MegaLights at full resolution, as the
; engine's own Cinematic level does, instead of Epic's half resolution (2x2). At still Cutlass views it halves the
; pixels that change between frames (cargo bay 0.59 % -> 0.23 %, cockpit aft 1.49 % -> 0.75 %) for +0.65..0.75 ms GPU.
; NumSamplesPerPixel is already at its maximum (4) at Epic.
r.MegaLights.DownsampleMode=0

[GlobalIlluminationQuality@3]
; Look (2026-11-12, plan D15, adjudicated): Lumen short-range AO traced with hardware ray tracing replaces the game's
; SSDO as contact occlusion (ue/verification/LOOK-1.md). +1.6..1.9 ms at 1600x900 over screen-space short-range AO.
r.Lumen.ScreenProbeGather.ShortRangeAO.HardwareRayTracing=1

[TextureQuality@3]
; Imported ship and environment textures are created resident (not streamed); with a game hangar loaded they exceed
; Epic's 1000 MB pool and UE reports it on screen. 24 GB-class GPUs hold 8 GB comfortably (LOOK-3).
r.Streaming.PoolSize=8000
