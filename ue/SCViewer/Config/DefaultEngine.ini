[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Viewer
GameDefaultMap=/Game/Maps/Viewer

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
; WP-U3b decision (ue/verification/WP-U3b.md §13): histogram auto exposure in EV100 units, no project bias.
; Lights are candela and emissives cd/m2 from the game's own scene unit; at run time the viewer installs the
; game's exposure chain (compensation curve, multiplier clamp, adaptation; SCViewerExposure.cpp) and its
; display curve on top of these defaults.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Bias=0
; The game's exposure histogram meters Rec.709 luminance (Histogram.cfxb, GetLuminance); 2 = the working colour
; space's luminance weights (UE's default 0 is the plain channel average).
r.AutoExposure.LuminanceMethod=2
; WP-U3b decision: MegaLights (experimental in 5.8.2 and 5.9.0) shades all 76-225 local lights per ship with
; ray-traced shadows at a fixed cost (HWRT, VULKAN_SM6); the sun stays on virtual shadow maps.
r.MegaLights.EnableForProject=1
; WP-U3b importer follow-through: one light-function MID per gobo texture. Verified 8 Cutlass,
; 10 Scorpius and 6 Gladius materials fit the engine-default atlas (Size=4, 16 slots); no override needed.
; WP-U2 decision (ue/verification/WP-U2.md): Substrate, adaptive GBuffer (VULKAN_SM6 bSupportsAdaptiveGBuffer).
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; WP-U2 decision (ue/verification/WP-U2.md, energy split): the masters apply the game's own diffuse / specular
; split, Albedo *= saturate(1 - luminance(F0)) (Graph.conserve); UE's view-dependent form of the same attenuation
; would apply it a second time.
r.Shading.EnergyPreservation=0

[SystemSettings]
; UE 5.9 Lumen World Cache: a world-space lighting cache filled by path tracing from the screen, replacing
; the card-based Surface Cache for Lumen HWRT hits (no card coverage gaps on thin, small or skinned meshes;
; more GI bounces). Read-only, needs a restart and a shader rebuild; active only with Lumen HWRT and the
; platform's Full or Simplified Material RT mode. r.Lumen.WorldCache.Allowed 0 switches back at run time.
r.Lumen.WorldCache.Supported=1

[/Script/EngineSettings.GameMapsSettings]
; WP-V1: viewer app game mode (pawn, controller, in-game UI) in every host (-game, PIE).
GlobalDefaultGameMode=/Script/SCBridge.SCViewerGameMode

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/Engine.Engine]
bSmoothFrameRate=False

; Reproducible local DDC for constrained/headless runs: pass -ddc=SCViewerDDC.
; This is engine build scratch, separate from the D10 processed cache in ./cache/.

[DerivedDataCacheGraphs]
SCViewerDDC=(SCViewerLocal)

[DerivedDataCacheStores]
SCViewerLocal=(Type=FileSystem,ReadOnly=false,Clean=false,Flush=false,PurgeTransient=true,DeleteUnused=true,UnusedFileAge=7,FoldersToClean=10,Path="%GAMEDIR%DerivedDataCache",CommandLineOverride=SCViewerDDCPath)


[/Script/UnrealEd.CookerSettings]
cook.AllowCookedDataInEditorBuilds=True
