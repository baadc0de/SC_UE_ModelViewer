; Win64 on the NvRTX engine branch (NvRTX/UnrealEngine nvrtx-5.8): the RTXPT evaluation look. Layered over
; DefaultEngine.ini on Windows only; the Linux / Vulkan / MegaLights setup is unchanged.
;
; Lighting: NvRTX sampled lighting instead of MegaLights + Lumen screen probes.
;   Direct   — RTXDI (ReSTIR DI): every local light sampled per pixel with ray-traced visibility.
;   Indirect — ReSTIR PT (r.SampledLighting.Indirect.Mode 2): path-traced diffuse, rough and mirror indirect;
;              replaces Lumen GI *and* Lumen reflections. Lumen stays the GI method: its HWRT surface cache is the
;              paths' final-bounce fallback. A/B at run time: Mode 1 = ReSTIR GI, 3 = Standard PT, 0 = off.
; Denoise/upscale: DLSS Ray Reconstruction (DLSS plugin, DenoiserMode 1). r.SampledLighting.Denoiser 2 (default)
;   routes the sampled signals through the third-party denoiser chain: the DLSS plugin's screen-space denoiser, which
;   leaves them to DLSS-RR when RR is active and otherwise passes them to NRD ReLAX. NvRTX only takes that path when
;   the NRD module is loaded (and shows a modal "requires the NRD plugin" dialog otherwise), so the project enables
;   both plugins on Win64. At r.ScreenPercentage 100 (DefaultEngine) it runs as
;   DLAA + RR; lower the screen percentage for DLSS-RR upscaling.
; Requirements: D3D12 SM6, hardware ray tracing (already on in DefaultEngine), an RTX GPU.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; NvRTX gates all sampled lighting off under Substrate's adaptive G-buffer (PlatformSupportsSampledLighting:
; "complex Substrate" = Substrate without the blendable G-buffer), so the RTXPT path needs the blendable format.
; Trade-off (WP-U59): blendable refits the slab's Diffuse Albedo / F0 / F90 into BaseColor / Metallic / Specular and
; visibly changes dark metal floors; DefaultEngine keeps adaptive (1) for the Linux / MegaLights look.
r.Substrate.ProjectGBufferFormat=0
r.MegaLights.EnableForProject=0
; RTX Mega Geometry (NvRTX, D3D12, read-only at run time): ray trace full-detail Nanite clusters instead of the
; meshes' fallback proxies, so shadow, GI and reflection rays hit what is rasterized. A/B at run time:
; r.Nanite.RayTracing.Update 0 = back to the proxy BLASes.
r.Nanite.RayTracing=1
r.SampledLighting.Direct=1
r.SampledLighting.Indirect=1
r.SampledLighting.Indirect.Mode=2

[SystemSettings]
r.NGX.DLSS.Enable=1
r.NGX.DLSS.DenoiserMode=1
; DLSS-RR replaces the built-in denoisers (BuiltInDenoiserOverride -1 = automatic); the plugin guide asks for the
; Lumen reflection bilateral filter to be off in config rather than at run time.
r.Lumen.Reflections.BilateralFilter=0
r.Lumen.Reflections.ScreenSpaceReconstruction=0
r.Lumen.Reflections.Temporal=0
r.Shadow.Denoiser=0
