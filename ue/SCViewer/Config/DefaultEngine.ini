[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Viewer
GameDefaultMap=/Game/Maps/Viewer

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
; WP-U3b decision (ue/verification/WP-U3b.md §13): histogram auto exposure in EV100 units, no project bias.
; Lights are candela and emissives cd/m2 from the game's own scene unit; at run time the viewer installs the
; game's exposure chain (compensation curve, multiplier clamp, adaptation; SCViewerExposure.cpp) and its
; display curve on top of these defaults.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Bias=0
; The game's exposure histogram meters Rec.709 luminance (Histogram.cfxb, GetLuminance); 2 = the working colour
; space's luminance weights (UE's default 0 is the plain channel average).
r.AutoExposure.LuminanceMethod=2
; WP-U3b decision: MegaLights (experimental in 5.8.2 and 5.9.0) shades all 76-225 local lights per ship at a fixed
; cost (HWRT, VULKAN_SM6); the sun stays on virtual shadow maps. Since WP-L1 only the authored shadow-casting lights
; cast (ray-traced) shadows; rooms are kept apart by lighting channels (SCLightAreas).
r.MegaLights.EnableForProject=1
; WP-U3b importer follow-through: one light-function MID per gobo texture (8 Cutlass, 10 Scorpius, 6 Gladius).
; WP-U2 decision (ue/verification/WP-U2.md): Substrate, adaptive GBuffer (VULKAN_SM6 bSupportsAdaptiveGBuffer).
; Kept over the blendable format in WP-U59: blendable refits the slab's Diffuse Albedo / F0 / F90 into
; BaseColor/Metallic/Specular and visibly changes dark metal floors (ue/verification/WP-U59.md).
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; WP-U2 decision (ue/verification/WP-U2.md, energy split): the masters apply the game's own diffuse / specular
; split, Albedo *= saturate(1 - luminance(F0)) (Graph.conserve); UE's view-dependent form of the same attenuation
; would apply it a second time.
r.Shading.EnergyPreservation=0

[SystemSettings]
; Light function atlas (LOOK-5/6). Size 8x8 = 64 material slots: a game hangar's 15 gobo materials plus a ship's 6-10
; overflow the default 16 (UE warns on screen, "will skip light functions"). MaxLightCount 255: the shaders read a light's
; atlas index from 8 bits (LightData.ush, & 0xFF) but the engine's default (-1) does not cap the count, so with a hangar
; (382 gobo lights) and a ship (up to 184) every light past 255 wrapped onto another light's projection: crosshatch and
; stripes on the floor and on the player that the path tracer did not show. The engine ranks lights by distance to the
; camera; lights beyond the nearest 254 keep their plain cone without the gobo.
r.LightFunctionAtlas.Size=8
r.LightFunctionAtlas.MaxLightCount=255
; Native resolution with TSR anti-aliasing (owner, LOOK-6): the engine's display-based default screen percentage
; (sg.ResolutionQuality 0) rendered large viewer windows well below 100 %.
r.ScreenPercentage.Default.Desktop.Mode=0
r.ScreenPercentage.Default=100
r.ScreenPercentage=100
r.AntiAliasingMethod=4
; UE 5.9 Lumen World Cache (plan D13): off. In 5.9.0 preview-1 its path tracer reads the G-buffer in a ray
; generation shader, where the adaptive Substrate G-buffer read is compiled out, so the cache never fills and
; Lumen loses indirect light; the blendable G-buffer fixes that at a material-fidelity cost the owner declined
; (ue/verification/WP-U59.md). Re-test on each 5.9.x: set 1, restart, r.Lumen.WorldCache.Debug 1 must show Entries > 0.
r.Lumen.WorldCache.Supported=0

