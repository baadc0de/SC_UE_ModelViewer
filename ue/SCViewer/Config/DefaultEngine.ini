[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Viewer
GameDefaultMap=/Game/Maps/Viewer

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
; WP-U3b decision (ue/verification/WP-U3b.md): auto exposure in EV100 units, no bias. The ship lights are
; candela (intensity_candela_proxy); measured picks: sun-lit exteriors EV100 -2.0/-1.6, Cutlass bay +0.3.
; Replaces the fixed exposure (min=max=1, bias +1) that blew out every interior.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Bias=0
; WP-U3b decision: MegaLights (experimental in 5.8.2) shades all 76-225 local lights per ship with
; ray-traced shadows at a fixed cost (HWRT, VULKAN_SM6); the sun stays on virtual shadow maps.
r.MegaLights.EnableForProject=1
; WP-U3b importer follow-through: one light-function MID per gobo texture. Verified 8 Cutlass,
; 10 Scorpius and 6 Gladius materials fit the engine-default atlas (Size=4, 16 slots); no override needed.
; WP-U2 decision (ue/verification/WP-U2.md): Substrate, adaptive GBuffer (VULKAN_SM6 bSupportsAdaptiveGBuffer).
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1

[/Script/EngineSettings.GameMapsSettings]
; WP-V1: viewer app game mode (pawn, controller, in-game UI) in every host (-game, PIE).
GlobalDefaultGameMode=/Script/SCBridge.SCViewerGameMode

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/Engine.Engine]
bSmoothFrameRate=False

; Reproducible local DDC for constrained/headless runs: pass -ddc=SCViewerDDC.
