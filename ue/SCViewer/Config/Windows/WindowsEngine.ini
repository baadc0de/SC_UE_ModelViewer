; Win64 (UE 5.9): D3D12 at shader model 6 only, the Windows counterpart of the Linux VULKAN_SM6 targeting in
; DefaultEngine.ini (Nanite, Substrate's adaptive G-buffer and hardware ray tracing need SM6). The look is the shared one
; in DefaultEngine.ini.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

; NVIDIA DLSS (plugin from NVIDIA, not in the repo: ue/Plugins/NVIDIA/DLSS, see ue/README.md). At DefaultEngine's
; r.ScreenPercentage 100 it runs as DLAA (native-resolution anti-aliasing); a lower screen percentage is DLSS Super
; Resolution (67 = Quality, 58 = Balanced, 50 = Performance). Without the plugin these cvars do nothing and TSR
; (r.AntiAliasingMethod 4) stays the anti-aliaser. r.NGX.DLSS.Enable 0 at run time switches back to TSR.
[SystemSettings]
r.NGX.DLSS.Enable=1
